# Builds the static site and publishes it to GitHub Pages on every push to main
# (including saves from the /admin CMS, which commit to main).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "알림 테스트: 빌드를 일부러 실패시킵니다 (사이트는 그대로 유지)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer save replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: pages
        uses: actions/configure-pages@v5

      - if: inputs.simulate_failure
        run: echo "Simulated failure to test the alert" && exit 1

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          # "/<repo>" for a project site, "" for a user site or custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # When a save takes an image out of a work (or deletes the work), the image file is
  # deleted too, so the CMS asset library keeps only what the site uses. It looks at
  # the whole history, not just this push, so saves whose deploy was cancelled by a
  # newer one are covered too. Runs beside the build; the site never uses those files.
  # See scripts/prune-media.mjs. (A push made with this job's token starts no new deploy.)
  prune:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none # full history for the diff, file contents only when needed

      - name: Delete images no work uses any more
        run: |
          node scripts/prune-media.mjs --all
          git add -A content/media
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Delete images no work uses any more"
          # A CMS save may have landed meanwhile.
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells the system owner when something needs attention, via a GitHub issue
  # assigned to them (GitHub emails the assignee):
  # - a failed build/deploy (usually a CMS save the build rejects). The site keeps
  #   serving the last good version meanwhile. The issue closes itself on the next
  #   successful deploy.
  # - the repo passing 700 MB (uploaded originals stay in git history for good).
  notify:
    needs: [build, prune, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: DongHyos # system owner's GitHub login
      FAILED: ${{ needs.build.result == 'failure' || needs.deploy.result == 'failure' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ACTOR: ${{ github.actor }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      PRUNE_FAILED: ${{ needs.prune.result == 'failure' }}
    steps:
      - name: Open, update or close the failure issue
        run: |
          title="사이트 배포 실패"
          open=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$FAILED" = "true" ]; then
            body=$(printf '배포가 실패해서 사이트가 갱신되지 않았습니다. 사이트는 마지막 정상 버전으로 계속 열립니다.\n\n- 실행 기록: %s\n- 변경한 사람: %s\n- 변경 내용: %s' "$RUN_URL" "$ACTOR" "${COMMIT_MSG:-(수동 실행)}")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$title" --assignee "$OWNER" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "다시 정상 배포됐습니다: $RUN_URL"
          fi

      # The site is fine either way; the removed images just stay in the asset library.
      - name: Report a failed image clean-up
        if: env.PRUNE_FAILED == 'true'
        run: |
          gh issue create --title "안 쓰는 이미지 정리 실패" --assignee "$OWNER" \
            --body "$(printf '작업에서 뺀 이미지를 지우지 못했습니다. 사이트에는 영향이 없습니다.\n\n- 실행 기록: %s\n- 정리하려면 로컬에서: node scripts/prune-media.mjs --all' "$RUN_URL")"

      - name: Warn when the repo passes 700 MB
        run: |
          title="저장소 용량 경고"
          kb=$(gh api "repos/$GH_REPO" --jq .size)
          if [ "$kb" -gt $((700 * 1024)) ]; then
            open=$(gh issue list --state open --json title --jq ".[] | select(.title == \"$title\") | .title" | head -1)
            [ -n "$open" ] || gh issue create --title "$title" --assignee "$OWNER" \
              --body "저장소가 $((kb / 1024)) MB입니다 (권장 1 GB 이하). 업로드 원본 용량 줄이는 방법을 정할 때입니다."
          fi
