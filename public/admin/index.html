<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>포트폴리오 관리</title>
  </head>
  <body>
    <!-- Sveltia CMS reads config.yml from this folder. Saving commits to GitHub,
         and the GitHub Actions workflow rebuilds and redeploys the site. -->
    <!-- Pinned on purpose: this script handles the repo-write token, so a new release
         must not load until it has been checked. To upgrade, change the version and
         recompute the hash:
         curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.266.0/dist/sveltia-cms.js"
      integrity="sha384-MvIc9V6dpnf1+8gMj6610BmYWClYbpAyg810CA5ad7jCJmLlpGsOZTJOpOewp0wn"
      crossorigin="anonymous"
    ></script>
    <script>
      // "period" field: [YYYY.MM] ~ [YYYY.MM] on one line, saved as "2024.03 ~ 2024.04"
      // (or just "2024.03"). Typing digits only inserts the dot: 202403 → 2024.03.
      (function () {
        var valid = /^\d{4}\.(0[1-9]|1[0-2])$/;
        var format = function (v) {
          var d = String(v || "").replace(/\D/g, "").slice(0, 6);
          return d.length > 4 ? d.slice(0, 4) + "." + d.slice(4) : d;
        };
        var parts = function (v) {
          var p = String(v || "").split(/\s*[~–—]\s*/);
          return [p[0] || "", p[1] || ""];
        };
        var join = function (a, b) {
          return b ? a + " ~ " + b : a;
        };
        var box = function (props, value, other, isStart) {
          var bad = value !== "" && !valid.test(value);
          return h("input", {
            id: isStart ? props.forID : undefined,
            type: "text",
            inputMode: "numeric",
            placeholder: isStart ? "2024.03" : "2024.04",
            maxLength: 7,
            value: value,
            "aria-label": isStart ? "시작 (연도.월)" : "끝 (연도.월)",
            style: {
              width: "120px",
              padding: "8px 10px",
              border: "1px solid " + (bad ? "#e5484d" : "rgba(127,127,127,.4)"),
              borderRadius: "4px",
              font: "inherit",
              color: "inherit",
              background: "transparent",
            },
            onInput: function (e) {
              var v = format(e.target.value);
              props.onChange(isStart ? join(v, other) : join(other, v));
            },
          });
        };
        var PeriodControl = createClass({
          render: function () {
            var p = parts(this.props.value);
            return h(
              "div",
              { style: { display: "flex", alignItems: "center", gap: "10px" } },
              box(this.props, p[0], p[1], true),
              h("span", { "aria-hidden": "true" }, "~"),
              box(this.props, p[1], p[0], false),
            );
          },
        });
        var PeriodPreview = createClass({
          render: function () {
            return h("span", null, this.props.value || "");
          },
        });
        CMS.registerFieldType("period", PeriodControl, PeriodPreview);
      })();
    </script>
  </body>
</html>
